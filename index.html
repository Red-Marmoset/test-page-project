<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Red Marmoset Studios test page for Smith builds and deployments." />
    <meta name="theme-color" content="#173b56" />
    <title>Test page · Red Marmoset Studios</title>
    <script type="module" src="/src/main.js"></script>
  </head>
  <body>
    <main>
      <header><span class="mark" aria-hidden="true">RM</span> Red Marmoset Studios</header>
      <section aria-labelledby="title">
        <p class="intro">A little space to try things.</p>
        <h1 id="title">Test page.</h1>
        <p class="description">A simple playground for Smith builds and deployments. If you can see this, the page made it here.</p>
        <div class="interaction">
          <button type="button" id="test-button">Test a click</button>
          <p id="click-result" role="status">Ready when you are.</p>
        </div>
        <noscript><p>Enable JavaScript to try the button.</p></noscript>
      </section>
      <footer>
        <a href="https://github.com/Red-Marmoset/test-page-project">View the project on GitHub</a>
        <span>Just a test. Plenty of possibilities.</span>
      </footer>
    </main>
  </body>
</html>
